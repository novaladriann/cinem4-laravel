name: Temporary Midtrans Recovery Formatter
on:
  push:
    paths:
      - .github/workflows/midtrans-recovery-format.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Format and export payment recovery files
        run: |
          composer lint
          npm run check:fix
          echo START_RECOVERY_0
          base64 -w0 'app/Services/MidtransSandboxService.php'
          echo
          echo END_RECOVERY_0
          echo START_RECOVERY_1
          base64 -w0 'resources/js/pages/bookings/Show.vue'
          echo
          echo END_RECOVERY_1
          echo START_RECOVERY_2
          base64 -w0 'tests/Feature/MidtransSandboxTest.php'
          echo
          echo END_RECOVERY_2
          echo START_RECOVERY_3
          base64 -w0 'docs/PROJECT_STATUS.md'
          echo
          echo END_RECOVERY_3
          echo START_RECOVERY_4
          base64 -w0 'docs/TESTING.md'
          echo
          echo END_RECOVERY_4
          echo START_RECOVERY_5
          base64 -w0 'docs/midtrans-sandbox.md'
          echo
          echo END_RECOVERY_5
