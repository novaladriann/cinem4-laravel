name: Temporary Booking Formatter
on:
  push:
    paths:
      - .github/workflows/booking-formatter.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Format booking changes
        run: |
          composer lint
          npm run check:fix
          for spec in "MIGRATION database/migrations/2026_11_22_000004_create_booking_reservations.php" "BOOKING app/Models/Booking.php" "SEAT app/Models/BookingSeat.php" "SERVICE app/Services/SeatReservationService.php" "SHOWTIME app/Http/Controllers/ShowtimeController.php" "CONTROLLER app/Http/Controllers/BookingController.php" "SCHEDULE app/Models/Schedule.php" "ROUTES routes/web.php" "SIDEBAR resources/js/components/AppSidebar.vue" "MOVIES_UI resources/js/pages/movies/Index.vue" "SHOWTIMES_UI resources/js/pages/showtimes/Index.vue" "SEATS_UI resources/js/pages/showtimes/Show.vue" "BOOKING_UI resources/js/pages/bookings/Show.vue" "BOOKINGS_UI resources/js/pages/bookings/Index.vue" "BOOKING_TEST tests/Feature/SeatBookingTest.php" "ADMIN_CTRL app/Http/Controllers/Admin/ScheduleManagementController.php" "ADMIN_TEST tests/Feature/Admin/CinemaScheduleManagementTest.php"; do
            set -- $spec
            echo "BEGIN_CINEM4_${1}"
            base64 -w0 "$2"
            echo
            echo "END_CINEM4_${1}"
          done
