name: Temporary Operations Formatter
on:
  push:
    paths:
      - .github/workflows/operations-formatter.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Format operational files
        run: |
          composer lint
          npm run check:fix
          for spec in "MIGRATION database/migrations/2026_11_22_000003_create_studios_and_link_schedules.php" "STUDIO_MODEL app/Models/Studio.php" "CINEMA_MODEL app/Models/Cinema.php" "SCHEDULE_MODEL app/Models/Schedule.php" "ROUTES routes/web.php" "CINEMA_CTRL app/Http/Controllers/Admin/CinemaManagementController.php" "STUDIO_CTRL app/Http/Controllers/Admin/StudioManagementController.php" "SCHEDULE_CTRL app/Http/Controllers/Admin/ScheduleManagementController.php" "TEST tests/Feature/Admin/CinemaScheduleManagementTest.php" "CINEMAS_UI resources/js/pages/admin/cinemas/Index.vue" "SCHEDULES_UI resources/js/pages/admin/schedules/Index.vue" "SIDEBAR resources/js/components/AppSidebar.vue"; do
            set -- $spec
            echo "BEGIN_CINEM4_${1}"
            base64 -w0 "$2"
            echo
            echo "END_CINEM4_${1}"
          done
