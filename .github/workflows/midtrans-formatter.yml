name: Temporary Midtrans Formatter
on:
  push:
    paths:
      - .github/workflows/midtrans-formatter.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Format Midtrans code
        run: |
          composer lint
          npm run check:fix
          for spec in "MIGRATION database/migrations/2026_11_22_000005_add_midtrans_sandbox_payments.php" "SERVICE app/Services/MidtransSandboxService.php" "CONTROLLER app/Http/Controllers/MidtransPaymentController.php" "BOOKING_MODEL app/Models/Booking.php" "RESERVATION_SERVICE app/Services/SeatReservationService.php" "BOOKING_CTRL app/Http/Controllers/BookingController.php" "ADMIN_CTRL app/Http/Controllers/Admin/ScheduleManagementController.php" "ROUTES routes/web.php" "BOOTSTRAP bootstrap/app.php" "CONFIG config/services.php" "BOOKING_UI resources/js/pages/bookings/Show.vue" "BOOKINGS_UI resources/js/pages/bookings/Index.vue" "TEST tests/Feature/MidtransSandboxTest.php"; do
            set -- $spec
            echo "BEGIN_CINEM4_${1}"
            base64 -w0 "$2"
            echo
            echo "END_CINEM4_${1}"
          done
