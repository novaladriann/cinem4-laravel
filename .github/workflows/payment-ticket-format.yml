name: Temporary Payment Ticket Formatter
on:
  push:
    paths:
      - .github/workflows/payment-ticket-format.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Format all modified files
        run: |
          composer lint
          npm run check:fix
          echo 'START_FILE_0'
          base64 -w0 'database/migrations/2026_11_22_000006_create_tickets.php'
          echo
          echo 'END_FILE_0'
          echo 'START_FILE_1'
          base64 -w0 'app/Models/Ticket.php'
          echo
          echo 'END_FILE_1'
          echo 'START_FILE_2'
          base64 -w0 'app/Models/Booking.php'
          echo
          echo 'END_FILE_2'
          echo 'START_FILE_3'
          base64 -w0 'app/Services/MidtransSandboxService.php'
          echo
          echo 'END_FILE_3'
          echo 'START_FILE_4'
          base64 -w0 'app/Http/Controllers/MidtransPaymentController.php'
          echo
          echo 'END_FILE_4'
          echo 'START_FILE_5'
          base64 -w0 'app/Http/Controllers/BookingController.php'
          echo
          echo 'END_FILE_5'
          echo 'START_FILE_6'
          base64 -w0 'app/Http/Controllers/TicketController.php'
          echo
          echo 'END_FILE_6'
          echo 'START_FILE_7'
          base64 -w0 'app/Http/Controllers/Admin/TicketVerificationController.php'
          echo
          echo 'END_FILE_7'
          echo 'START_FILE_8'
          base64 -w0 'app/Console/Commands/ReconcileMidtransPayments.php'
          echo
          echo 'END_FILE_8'
          echo 'START_FILE_9'
          base64 -w0 'routes/web.php'
          echo
          echo 'END_FILE_9'
          echo 'START_FILE_10'
          base64 -w0 'routes/console.php'
          echo
          echo 'END_FILE_10'
          echo 'START_FILE_11'
          base64 -w0 'resources/js/pages/bookings/Show.vue'
          echo
          echo 'END_FILE_11'
          echo 'START_FILE_12'
          base64 -w0 'resources/js/pages/admin/tickets/Verify.vue'
          echo
          echo 'END_FILE_12'
          echo 'START_FILE_13'
          base64 -w0 'tests/Feature/MidtransSandboxTest.php'
          echo
          echo 'END_FILE_13'
          echo 'START_FILE_14'
          base64 -w0 'docs/payment-ticket-testing.md'
          echo
          echo 'END_FILE_14'
