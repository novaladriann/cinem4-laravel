name: Temporary Midtrans Doc Formatter
on:
  push:
    paths:
      - .github/workflows/midtrans-doc-formatter.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: |
          npm run check:fix
          echo "BEGIN_DOC_EXPORT"
          base64 -w0 docs/midtrans-sandbox.md
          echo
          echo "END_DOC_EXPORT"
