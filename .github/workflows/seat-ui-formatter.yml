name: Temporary Seat UI Formatter
on:
  push:
    paths:
      - .github/workflows/seat-ui-formatter.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Format and export component
        run: |
          npm run check:fix
          echo "BEGIN_CINEM4_SEAT_FORMAT"
          base64 -w0 resources/js/pages/showtimes/Show.vue
          echo
          echo "END_CINEM4_SEAT_FORMAT"
